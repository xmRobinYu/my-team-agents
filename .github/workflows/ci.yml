name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: pnpm -r --if-present typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build

  verify-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: node packages/cost-report/dist/cli.js --help
      - run: node packages/cost-report/dist/cli.js --session packages/cost-report/fixtures/sessions/sample.jsonl | grep -q totalTokens

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-guardrails.sh

  # Tests must be self-sufficient: this job never runs a build, so a test suite
  # that silently depends on dist/ fails here even though `test` passes.
  test-no-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-package-exports.mjs
      - run: pnpm test

  # Offline mapping check only. The network sync (just sync-docs) needs local
  # lark-cli user credentials and is deliberately not a CI job.
  docs-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-feishu-docs.mjs --check

  # Bitable projection mapping: parses the docs and validates the declared schema.
  # Node-only, no credentials; the network upsert stays manual like `just sync-docs`.
  bitable-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-feishu-bitable.mjs --check

  # Sync-layer unit tests (node:test, no pnpm install needed).
  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs

  # Branch protection points at this single job. It is always() guarded so a
  # skipped upstream job cannot be read as a pass.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [typecheck, test, build, verify-cli, guardrails, docs-mapping, bitable-mapping, scripts-test, test-no-build]
    if: always()
    steps:
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "needs: $NEEDS"
          failed="$(echo "$NEEDS" | grep -o '"result": "[^"]*"' | grep -v '"result": "success"' || true)"
          skipped="$(echo "$NEEDS" | grep -o '"result": "[^"]*"' | grep '"result": "skipped"' || true)"
          if [ -n "$failed" ] || [ -n "$skipped" ]; then
            echo "one or more required checks did not succeed"
            exit 1
          fi
          echo "all checks passed"
