# Engagement constraints — L3 (critical) posture, scoped to what this repo
# actually enforces today. Thresholds mirror the Verification Matrix in AGENTS.md;
# nothing here names a gate that does not exist.

version: 1
strictness: L3-critical

scope:
  mode: greenfield
  large_refactor: none
  reference_repos_readonly: true

size_limits:
  # ENFORCED by `just verify-file-size` (part of `just check`). A ratchet: files
  # already over the line are recorded in scripts/file-size-baseline.json at their
  # current size and may only shrink; a new file over the limit fails the gate.
  # max_complexity is NOT enforced (no checker) and is recorded as a gap below.
  max_file_lines: 800
  max_complexity: 15

# P9a: the first surface where external bytes enter the platform. Before this,
# "no external input" was guaranteed only by binding the listener to 127.0.0.1
# plus a verbal boundary (Q23) — no stated limit at all. These are real, enforced
# thresholds (the PRD asked for exactly this): truncation happens in `normalizeEvent`,
# the tool allowlist is refused at rule registration AND reaches `pi --tools`, and the
# entry is opt-in. Everything below is enforced by code, not aspiration.
ingest_limits:
  summary_chars: 200          # normalizeEvent
  detail_chars: 4000          # normalizeEvent
  body_bytes: 65536           # route-level bodyLimit; truncation runs AFTER Fastify buffers
  min_token_chars: 24         # a shorter token closes the surface, it does NOT go anonymous
  writable_tools: forbidden   # AC5.2 — refused at registration until P9d isolation exists
  enabled_by_default: false   # D6/A — MTA_INGEST_ENABLED=1 is required
  requires_token: always_when_enabled   # P9c: enabled without a usable token is CLOSED
  anonymous_opt_in: MTA_INGEST_ALLOW_ANON=1  # the only way to open it unauthenticated
  max_parallel_per_rule: 8    # P9c — claimNext counts against this; groupId tasks clamp to 1
  tell_channels: single       # P9b — MTA_TELL_WEBHOOK, unset means silence
  tell_dedup_key: rule+subject+kind          # identity, not Task; cooldown is separate

# `just verify-file-size` enforces size_limits.max_file_lines with a ratchet baseline
# (scripts/file-size-baseline.json). max_complexity is still NOT enforced — no checker,
# recorded as a gap rather than a guarantee.

enforcement:
  # No phantom enforcement: eslint is NOT installed, so no lint surface is declared.
  typecheck: block
  tests: block
  cli_smoke: block
  guardrail_self_test: block
  naming_and_backups: block
  rule_file_changes: block
  file_size: block

quality:
  # Gaps, not fabricated thresholds: neither of these has a checker.
  #   max_complexity  — no cyclomatic-complexity tool installed.
  #   coverage_per_file — no coverage tooling wired.
  coverage_per_file: null
  duplicate_limit_percent: 3
  anti_stub: block
  anti_drift: block

pr_review:
  diff_size: block
  rule_file_change_requires_reason: true

verification_surfaces:
  - id: typecheck
    command: just typecheck
    blocking: true
  - id: test
    command: just test
    blocking: true
  - id: build
    command: just build
    blocking: true
  - id: verify-cli
    command: just verify-cli
    blocking: true
  - id: test-guardrails
    command: just test-guardrails
    blocking: true

deferred_modules:
  - id: capability-packages
    reason: deferred by user; v1 scripture is LLM wiki + RAG
  - id: promotion-grading
    reason: deferred by user; v1 evaluation is a daily self-assessment skill
  - id: five-layer-cost-ledger
    reason: deferred; v1 cost report reads session logs directly
